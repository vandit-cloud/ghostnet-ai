[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostnet-ai"
version = "0.1.0"
description = "Side-scan sonar marine-debris detection for SIH26057. Member 1's AI half."
requires-python = ">=3.11"
readme = "README.md"

# Deliberately loose, and deliberately NOT pinned to +cu126.
#
# ai/requirements.txt pins the exact CUDA build for Member 1's RTX 3050. This
# file is what Member 2 installs, and their machine may have no GPU at all --
# pinning a CUDA-local version here would either fail to resolve or drag a
# 2.6 GB CUDA wheel onto a laptop that cannot use it. The package runs on CPU
# by design (config.resolve_device falls back), so the loose pins are correct
# for the consumer and the strict ones stay where they belong: the dev env.
dependencies = [
    "torch>=2.6",
    "torchvision>=0.21",
    "ultralytics>=8.3",
    "segmentation-models-pytorch>=0.5",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.21"]
# The CPU runtime (ghostnet.runtime): serves verified .onnx exports when there
# is no GPU. Optional -- without it everything runs under torch, just slower
# (detector + net U-Net 0.61 s/tile on CPU vs 0.44 s with ONNX Runtime).
onnx = ["onnxruntime>=1.18"]
# What ai/scripts/export_onnx.py needs to MAKE the exports.
export = ["onnx>=1.16", "onnxruntime>=1.18"]

[tool.setuptools]
packages = ["ghostnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
