# YOLO11 with a P2/4 detection head, for the `wreck` small-object gap.
#
# Why this file exists
# --------------------
# Measured 2026-09-13 (ai/scripts/recall_by_size.py), gv5 on the test split:
#
#   >2% of frame     176/335   recall 0.525
#   0.5-2%            13/174   recall 0.075
#   <0.5%             27+0/327 recall ~0.08
#
# Recall collapses by a factor of seven below 2% of frame. That is not label
# noise (the boxes are derived from AI4Shipwrecks pixel masks) and not tiling
# debris (279 of 327 small test boxes are interior, never cut by the grid).
# It is a resolution limit.
#
# Stock yolo11 detects on P3/8, P4/16, P5/32. At 640x640 the finest head has a
# stride of 8, so a 45x45 px object -- which is what 0.5% of frame is -- lands
# on roughly 5x5 feature cells. A P2/4 head doubles that to ~11x11, which is the
# difference between an object the head can localise and one it cannot.
#
# This is why the small-object fix is architectural rather than a matter of more
# data or a better-pretrained backbone: SSL improves feature quality, but no
# pretraining lets a stride-8 head represent something finer than stride 8.
#
# Cost, and the reason to check VRAM before committing a night to it
# ------------------------------------------------------------------
# The P2 feature map is 160x160 at imgsz 640, four times the area of P3's 80x80,
# and it carries the widest activations in the network. On 4 GB this is the most
# likely thing in the project to OOM, so probe before launching -- see
# ai/scripts/probe_p2_vram.py.
#
# Structure follows ultralytics' own yolov8-p2.yaml, transposed onto the yolo11
# backbone: one more upsample/concat step down to backbone layer 2 (P2/4), one
# more downsample step back up, and a four-input Detect.

nc: 5 # wreck, plane, debris, ghost_pot, ghost_net
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  # [from, repeats, module, args]      -- identical to stock yolo11, so the
  #                                       pretrained backbone loads cleanly
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2        <- P2 features, newly used
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall)   <- the point of this file

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 16], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
