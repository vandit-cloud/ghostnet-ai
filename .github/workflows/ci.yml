name: CI

on:
  push:
    branches: [main, develop, member1-ai, member2-app]
  pull_request:
    branches: [main, develop, member1-ai, member2-app]

jobs:
  backend:
    name: Backend (FastAPI + Postgres/PostGIS)
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ghostnet
          POSTGRES_PASSWORD: ghostnet
          POSTGRES_DB: ghostnet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ghostnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ghostnet:ghostnet@localhost:5432/ghostnet_test
      DATABASE_URL: postgresql+psycopg://ghostnet:ghostnet@localhost:5432/ghostnet_test
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Alembic migrations apply cleanly
        run: alembic upgrade head
      - name: Test suite
        run: pytest -q

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  ai:
    name: AI (pytest + contract check, CPU-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AI deps (CPU torch -- no GPU on this runner)
        run: |
          grep -v -E '^(--extra-index-url|torch==|torchvision==)' ai/requirements.txt > /tmp/requirements-ci.txt
          pip install torch==2.13.0 torchvision==0.28.0
          pip install -r /tmp/requirements-ci.txt
      - name: Test suite
        run: pytest ai/tests -q
      - name: Contracts not stale
        run: python ai/scripts/export_schemas.py --check
