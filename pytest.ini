# Root pytest config. Added 2026-09-04, when the app half was merged in by
# subtree and `pytest` from the repository root suddenly tried to collect
# app/backend/tests as well.
#
# The two halves have SEPARATE virtualenvs on purpose, and that is not going to
# change: ai/ needs torch, ultralytics and opencv; app/backend needs FastAPI,
# SQLAlchemy, pydantic-settings and a live Postgres+PostGIS. Neither venv can
# import the other's dependencies, so a single collection across both fails
# before it runs a single test -- `ModuleNotFoundError: No module named
# 'pydantic_settings'` is what that looks like.
#
# So `pytest` at the root means the AI suite, exactly as it did before the
# merge. Run the backend's suite from its own directory with its own venv:
#
#     cd app/backend && .venv/Scripts/python.exe -m pytest
#
# and the frontend's with `cd app/frontend && npx vitest run`.
#
# During a training run use GHOSTNET_DEVICE=cpu: the 4 GB of VRAM is shared and
# a test that loads the model onto CUDA can OOM the trainer.
[pytest]
testpaths = ai/tests
norecursedirs = app .venv .git ai/data ai/experiments ai/models runs weights node_modules
