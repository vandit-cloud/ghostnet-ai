# If ports 5432/8000/3000 collide with something else on your machine, add a
# docker-compose.override.yml next to this file remapping the host side of
# the `ports:` entries below (compose merges override files automatically).
services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghostnet
      POSTGRES_PASSWORD: ghostnet
      POSTGRES_DB: ghostnet
    ports:
      - "5432:5432"
    volumes:
      - ghostnet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostnet"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    # Build context is the repository root (see backend/Dockerfile) so the
    # image can reach ai/ and install the `ghostnet` package editable,
    # --no-deps, alongside the lightweight numpy/pyproj/opencv it needs to
    # split a .xtf into frames (ghostnet/xtf.py, ghostnet/survey.py).
    #
    # CPU-only torch, torchvision, ultralytics and segmentation-models-pytorch
    # ARE installed (see backend/Dockerfile), so `try_build()` loads the real
    # GhostNetAdapter; MockAIAdapter is only the fallback when that fails, and
    # its payloads say so (model_version "mock-ghostnet-dev-v0").
    #
    # Which models run depends on what is on disk when the image is built:
    # ai/models/trained/ghostnet.pt (the detector) is in git, but the ghost_net
    # U-Net, ghostnet_net.pt, is gitignored -- a fresh clone builds an image
    # without it, and net segmentation is then off. Inference is CPU-only here;
    # the demo runs natively (docs/DEMO_RUNBOOK.md).
    build:
      context: ..
      dockerfile: app/backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://ghostnet:ghostnet@db:5432/ghostnet
      JWT_SECRET: change-me-in-production
      SEED_ADMIN_USERNAME: operator
      SEED_ADMIN_PASSWORD: operator123
      STORAGE_ROOT: /app/uploads
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ghostnet_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle at build time (Next.js NEXT_PUBLIC_* rule) -
        # must match whatever host/port the backend is actually reachable on.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000/api/v1
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  ghostnet_pgdata:
  ghostnet_uploads:
